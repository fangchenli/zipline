name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # no floating major-version tags
      # The locked ruff version, without building the package.
      - run: uv run --locked --only-group lint ruff check zipline tests scripts benchmarks
      - run: uv run --locked --only-group lint ruff format --check zipline tests scripts benchmarks

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0  # no floating major-version tags
      - run: uv sync --locked
      - run: uv run ty check zipline tests/typing

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0  # no floating major-version tags
      - run: uv sync --locked --group docs
      - run: uv run --group docs sphinx-build -b html docs/source docs/build/html

  benchmarks:
    # Checks that the asv benchmarks still run; CI runners are too noisy for
    # timings. Compare performance locally with `asv continuous`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0  # no floating major-version tags
      - run: uv sync --locked --group bench
      - run: uv run asv machine --yes
      - run: uv run asv run --python=same --quick --show-stderr  # exits non-zero if a benchmark fails

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools-scm needs tags
      - uses: astral-sh/setup-uv@v10.2.0  # no floating major-version tags
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest -n auto
      - run: uv run pytest --doctest-modules zipline
